[workspace]
resolver = "2"
members = [
    "crates/foh-core",
    "crates/foh-mix",
    "crates/foh-control",
    "crates/foh-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["AI FOH Engine contributors"]
rust-version = "1.75"

[workspace.dependencies]
foh-core = { path = "crates/foh-core" }
foh-mix = { path = "crates/foh-mix" }
foh-control = { path = "crates/foh-control" }
