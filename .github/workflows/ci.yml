name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: test
        run: cargo test --workspace

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cmake
        run: |
          cmake -S cpp/foh_dsp -B build-dsp
          cmake --build build-dsp
          ./build-dsp/foh_dsp_selftest
